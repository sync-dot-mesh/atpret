[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/cli",
    "crates/daemon",
]

# Shared metadata — inherited by member crates via `.workspace = true`,
# same convention as sync-mesh-core.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sync-dot-mesh/atpret"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argenv = "0.1"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
